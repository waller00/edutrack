sonar.projectKey=final_class
sonar.projectName=final_class
sonar.projectVersion=1.0

sonar.sources=backend/src,frontend/web/src
sonar.tests=backend/src,frontend/web/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts,backend/prisma/**,backend/*.js,frontend/web/public/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/web/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/web/tsconfig.sonar.json

# No cuenta en % cobertura global (pipeline OCR/Tesseract; testear todo sería frágil y caro)
sonar.coverage.exclusions=**/routes/dni-processor.ts
