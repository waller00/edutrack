sonar.organization=joaquinwaller
sonar.projectKey=edutrack
sonar.projectName=edutrack
sonar.projectVersion=1.0

sonar.sources=backend/src,frontend/web/src
sonar.tests=backend/src,frontend/web/src
# *.itest.ts son las pruebas de integración (base real): son pruebas, no código de la app.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.itest.ts
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts,**/*.test.ts,**/*.test.tsx,**/*.itest.ts,backend/prisma/**,backend/*.js,frontend/web/public/**

# Falsos positivos aceptados, con su motivo, acá y no con "Aceptar" en SonarCloud: así quedan en
# el repo. Los de una sola línea van con `// NOSONAR` y la razón al lado.
#   client-ip.ts: los rangos privados (RFC 1918, link-local, ULA) son la definición de "el proxy
#   propio" para `trust proxy`, no la dirección de un servidor (S1313, IP escrita en el código).
sonar.issue.ignore.multicriteria=privateRanges
sonar.issue.ignore.multicriteria.privateRanges.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.privateRanges.resourceKey=backend/src/lib/client-ip.ts

# Cobertura: se mide sobre la capa de LÓGICA unit-testeable. Quedan fuera del cálculo
# de cobertura (pero siguen analizándose para bugs/smells) los adaptadores de
# integración (validados por integración/e2e), el bootstrap/wiring y la capa de UI.
# Es el mismo recorte que ya declaran backend/vitest.config.ts y frontend vitest.config.ts.
sonar.coverage.exclusions=\
  backend/src/server.ts,\
  backend/src/app.ts,\
  backend/src/instrument.ts,\
  backend/src/db/**,\
  backend/src/test-utils/**,\
  backend/src/auth/keycloak.ts,\
  backend/src/auth/session-store.ts,\
  backend/src/auth/sso-registration.ts,\
  backend/src/integrations/moodle/client.ts,\
  backend/src/integrations/moodle/enrolment-map.ts,\
  backend/src/integrations/moodle/object-map.ts,\
  backend/src/services/admin-testing-tools.ts,\
  backend/src/routes/admin-testing.ts,\
  backend/src/routes/admin-school-years.ts,\
  backend/src/routes/courses.ts,\
  backend/src/routes/admin-students.ts,\
  backend/src/routes/analytics.ts,\
  backend/src/routes/substitutions.ts,\
  backend/src/services/substitutions.ts,\
  backend/src/routes/attendance-incidents.ts,\
  backend/src/services/attendance-incidents.ts,\
  backend/src/services/analytics/exports/monthlySummaryPdf.ts,\
  backend/src/services/biometric-ingest-core.ts,\
  backend/src/services/biometric-link.ts,\
  backend/src/routes/biometric-link.ts,\
  frontend/web/src/app/**,\
  frontend/web/src/components/**,\
  frontend/web/src/contexts/**,\
  frontend/web/src/lib/notifications/**,\
  frontend/web/src/lib/substitutions/**,\
  frontend/web/src/lib/medical-leaves/certificate-client.ts,\
  frontend/web/src/lib/attendance/incidents-types.ts,\
  frontend/web/src/test/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/web/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/web/tsconfig.sonar.json
