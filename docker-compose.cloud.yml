services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-asistencias}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asistencias"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [net]

  auth:
    build: ./backend
    # Este comando asegura que las tablas se creen antes de iniciar el servidor
    command: sh -c "npx prisma db push ${PRISMA_DB_PUSH_FLAGS:-} && npm start"
    environment:
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-https://165.22.34.95:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-EduTrack}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-2h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_AUTO_DOMAIN: ${COOKIE_AUTO_DOMAIN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@pg:5432/asistencias?schema=public}
      PRISMA_DB_PUSH_FLAGS: ${PRISMA_DB_PUSH_FLAGS:-}
      # Correo (recuperación de contraseña, verificación): definir en .env del servidor
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # SendGrid: en muchos Droplets el SMTP 587 está bloqueado; con host smtp.sendgrid.net + user apikey el backend usa la API HTTPS (443).
      SENDGRID_HTTP_API: ${SENDGRID_HTTP_API:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      DIDIT_CALLBACK_URL: ${DIDIT_CALLBACK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://165.22.34.95:4000/auth/google/callback}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Moodle (misma red Docker que docker-compose.moodle.yml; ver MOODLE_HOST en ese archivo)
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      MOODLE_CANONICAL_HOST: ${MOODLE_CANONICAL_HOST:-}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:-}
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    ports:
      - "4000:4000"
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - net
      - moodle-net

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://165.22.34.95:4000}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL: ${NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL:-}
    # NEXT_PUBLIC_* en runtime no reemplaza lo ya embebido en el bundle de Next al construir la imagen.
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://165.22.34.95:4000}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL: ${NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_started
    networks: [net]

volumes:
  pgdata:

networks:
  net:
  moodle-net:
    name: edutrack_moodle-net
    external: true
