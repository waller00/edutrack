services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-asistencias}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asistencias"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data
    networks: [net]

  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - keycloakdata:/var/lib/postgresql/data
    networks: [net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    restart: unless-stopped
    # start-dev: arranque tolerante. Endurecer a `start` con KC_HOSTNAME real + SSL via Cloudflare.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
    volumes:
      - ./keycloak/realm-edutrack.json:/opt/keycloak/data/import/realm-edutrack.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8089:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [net]

  auth:
    build: ./backend
    # Este comando asegura que las tablas se creen antes de iniciar el servidor
    command: ["/app/docker-entrypoint.sh"]
    environment:
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://edutrack-uy.com,https://www.edutrack-uy.com}
      JWT_SECRET: ${JWT_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-EduTrack}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-2h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_AUTO_DOMAIN: ${COOKIE_AUTO_DOMAIN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@pg:5432/asistencias?schema=public}
      PRISMA_DB_PUSH_FLAGS: ${PRISMA_DB_PUSH_FLAGS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # --- Keycloak / BFF ---
      # ISSUER es publico: el navegador debe poder abrirlo. INTERNAL es solo backchannel Docker.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8089/realms/edutrack}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-edutrack-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-edutrack-web-secret-change-me}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:4000/auth/callback}
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-edutrack}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      # Correo (recuperación de contraseña, verificación): definir en .env del servidor
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # SendGrid: en muchos Droplets el SMTP 587 está bloqueado; con host smtp.sendgrid.net + user apikey el backend usa la API HTTPS (443).
      SENDGRID_HTTP_API: ${SENDGRID_HTTP_API:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      DIDIT_CALLBACK_URL: ${DIDIT_CALLBACK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Panel admin de pruebas (simular ADMS / limpiar datos). En testing: ALLOW_ADMIN_TESTING_TOOLS=1
      ALLOW_ADMIN_TESTING_TOOLS: ${ALLOW_ADMIN_TESTING_TOOLS:-}
      # Moodle (misma red Docker que docker-compose.moodle.yml; ver MOODLE_HOST en ese archivo)
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      MOODLE_CANONICAL_HOST: ${MOODLE_CANONICAL_HOST:-}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:-}
      MOODLE_ROLE_TEACHER_ID: ${MOODLE_ROLE_TEACHER_ID:-3}
      MOODLE_ROLE_STUDENT_ID: ${MOODLE_ROLE_STUDENT_ID:-5}
      # Rol Moodle del docente suplente (default: el rol de titular, MOODLE_ROLE_TEACHER_ID)
      MOODLE_ROLE_SUBSTITUTE_TEACHER_ID: ${MOODLE_ROLE_SUBSTITUTE_TEACHER_ID:-}
      MOODLE_ROOT_CATEGORY_ID: ${MOODLE_ROOT_CATEGORY_ID:-0}
      MOODLE_USER_AUTH: ${MOODLE_USER_AUTH:-manual}
      # ADMS ZKTeco: 0 = mismo puerto que PORT (4000). El reloj usa la URL pública HTTPS del API.
      ZKTECO_ICLOCK_PORT: ${ZKTECO_ICLOCK_PORT:-0}
      # Observabilidad (Sentry backend)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    ports:
      - "4000:4000"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - net
      - moodle-net

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL: ${NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        NEXT_PUBLIC_LOGROCKET_APP_ID: ${NEXT_PUBLIC_LOGROCKET_APP_ID:-}
        NEXT_PUBLIC_LOGROCKET_FORCE: ${NEXT_PUBLIC_LOGROCKET_FORCE:-false}
    # NEXT_PUBLIC_* en runtime no reemplaza lo ya embebido en el bundle de Next al construir la imagen.
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL: ${NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      NEXT_PUBLIC_LOGROCKET_APP_ID: ${NEXT_PUBLIC_LOGROCKET_APP_ID:-}
      NEXT_PUBLIC_LOGROCKET_FORCE: ${NEXT_PUBLIC_LOGROCKET_FORCE:-false}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-legacy}
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_started
    networks: [net]

volumes:
  pgdata:
  redisdata:
  keycloakdata:

networks:
  net:
  moodle-net:
    name: edutrack_moodle-net
    external: true
