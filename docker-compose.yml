services:
  pg:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-asistencias}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-asistencias}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data
    networks:
      - appnet

  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - keycloakdata:/var/lib/postgresql/data
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    restart: unless-stopped
    # start-dev: arranque tolerante para testing/local. En produccion endurecida
    # cambiar a `start` con KC_HOSTNAME y SSL via proxy (Cloudflare).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
    volumes:
      - ./keycloak/realm-edutrack.json:/opt/keycloak/data/import/realm-edutrack.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8089:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - appnet

  auth:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@pg:5432/${POSTGRES_DB:-asistencias}?schema=public}
      PRISMA_DB_PUSH_FLAGS: ${PRISMA_DB_PUSH_FLAGS:---accept-data-loss}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # --- Keycloak / BFF ---
      # ISSUER_URL = URL pública (navegador y Google). INTERNAL_URL = red Docker (backchannel).
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8089/realms/edutrack}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-edutrack-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-edutrack-web-secret-change-me}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:4000/auth/callback}
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-edutrack}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-EduTrack}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-2h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SENDGRID_HTTP_API: ${SENDGRID_HTTP_API:-}
      # Web Push (opcional): generar con `npx web-push generate-vapid-keys`
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # Didit (prueba de vida en registro): https://docs.didit.me/
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      # Opcional: callback HTTPS para crear sesión (Didit); ej. https://TU-NGROK.ngrok-free.app/register?liveness=1
      DIDIT_CALLBACK_URL: ${DIDIT_CALLBACK_URL:-}
      # RF-10 asistente (OpenAI): definir en .env del host; sin esto el endpoint responde 503
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_SQL_MODEL: ${OPENAI_SQL_MODEL:-}
      QUERY_ASSISTANT_MODE: ${QUERY_ASSISTANT_MODE:-}
      ALLOW_ADMIN_TESTING_TOOLS: ${ALLOW_ADMIN_TESTING_TOOLS:-1}
      # Moodle: en local con Docker, MOODLE_BASE_URL=http://moodle:8080 (red moodle-net) y patch de wwwroot; ver scripts/patch-moodle-wwwroot-dynamic.php
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      MOODLE_CANONICAL_HOST: ${MOODLE_CANONICAL_HOST:-}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:-}
      MOODLE_SYNC_ENABLED: ${MOODLE_SYNC_ENABLED:-false}
      MOODLE_ROLE_TEACHER_ID: ${MOODLE_ROLE_TEACHER_ID:-3}
      MOODLE_ROLE_STUDENT_ID: ${MOODLE_ROLE_STUDENT_ID:-5}
      # Rol Moodle del docente suplente (default: el rol de titular, MOODLE_ROLE_TEACHER_ID)
      MOODLE_ROLE_SUBSTITUTE_TEACHER_ID: ${MOODLE_ROLE_SUBSTITUTE_TEACHER_ID:-}
      MOODLE_ROOT_CATEGORY_ID: ${MOODLE_ROOT_CATEGORY_ID:-0}
      MOODLE_USER_AUTH: ${MOODLE_USER_AUTH:-manual}
      ZKTECO_ICLOCK_PORT: ${ZKTECO_ICLOCK_PORT:-8081}
      # Observabilidad (Sentry backend): vacio = deshabilitado
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - "4000:4000"
      - "8081:8081"
      - "80:8081"
      - "8088:8081"
    # Moodle en el host (puerto 8080): fuerza IPv4; sin esto Node puede resolver host.docker.internal solo a IPv6 y fallar.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - appnet
      - moodle-net

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL: ${NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
        NEXT_PUBLIC_LOGROCKET_APP_ID: ${NEXT_PUBLIC_LOGROCKET_APP_ID:-}
        NEXT_PUBLIC_LOGROCKET_FORCE: ${NEXT_PUBLIC_LOGROCKET_FORCE:-false}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL: ${NEXT_PUBLIC_DIDIT_BROWSER_RETURN_URL:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
      NEXT_PUBLIC_LOGROCKET_APP_ID: ${NEXT_PUBLIC_LOGROCKET_APP_ID:-}
      NEXT_PUBLIC_LOGROCKET_FORCE: ${NEXT_PUBLIC_LOGROCKET_FORCE:-false}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-legacy}
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - appnet

volumes:
  pgdata:
  redisdata:
  keycloakdata:

networks:
  appnet:
  moodle-net:
    name: edutrack_moodle-net
    external: true
