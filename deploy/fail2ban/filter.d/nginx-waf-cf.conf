# Filtro fail2ban para los bloqueos del WAF de nginx.
#
# Lee el json-log de Docker del contenedor del reverse-proxy (la línea de nginx va
# embebida en {"log":"...\n",...}). Marca como "fallo" toda respuesta que el WAF
# corta: 444 (lockdown / rutas de escáner / user-agents), 403, 405 (método), 429 (rate-limit).
# La IP capturada es la IP REAL del cliente (nginx ya la restauró desde CF-Connecting-IP).

[Definition]
failregex = ^\{"log":"<HOST> - - \[[^\]]+\] \\".*?\\" (?:403|405|429|444)
ignoreregex =
datepattern = \[%d/%b/%Y:%H:%M:%S %z\]
