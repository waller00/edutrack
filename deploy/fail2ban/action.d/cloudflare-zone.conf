# Acción fail2ban: banear/desbanear una IP en Cloudflare (IP Access Rules, a nivel de ZONA).
#
# Por qué a nivel de Cloudflare y no iptables: el origen está detrás de Cloudflare y solo ve
# IPs de CF a nivel de red, así que un ban en el firewall del host sería inútil. Baneando en
# Cloudflare, el atacante queda bloqueado en el borde, con su IP real.
#
# El token se lee de un archivo local (nunca va en el repo). Requiere un API Token con permiso
# Zone > Firewall Services > Edit sobre la zona edutrack-uy.com.

[Definition]
actionstart =
actionstop =
actioncheck =

actionban = curl -s -X POST "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules" -H "Authorization: Bearer $(cat <cftokenfile>)" -H "Content-Type: application/json" --data '{"mode":"block","configuration":{"target":"ip","value":"<ip>"},"notes":"fail2ban:<name>"}' >> <cflog> 2>&1

actionunban = ruleid=$(curl -s "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules?configuration.target=ip&configuration.value=<ip>&per_page=1" -H "Authorization: Bearer $(cat <cftokenfile>)" -H "Content-Type: application/json" | python3 -c 'import sys,json;r=(json.load(sys.stdin).get("result") or []);print(r[0]["id"] if r else "")'); [ -n "$ruleid" ] && curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules/$ruleid" -H "Authorization: Bearer $(cat <cftokenfile>)" >> <cflog> 2>&1 || true

[Init]
# Zone ID de edutrack-uy.com (identificador público, no secreto).
cfzone = 4584a387a67e88275ccbd99b5a797c44
# Archivo con el API token (chmod 600, root). NUNCA se commitea.
cftokenfile = /root/.cf_token
cflog = /var/log/fail2ban-cloudflare.log
