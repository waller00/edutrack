name: Container Security - Trivy

on:
  push:
    branches: [main, monitoreo]
  pull_request:
    branches: [main, monitoreo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_SEVERITY: HIGH,CRITICAL
  TRIVY_TIMEOUT: 10m

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: 1
          timeout: ${{ env.TRIVY_TIMEOUT }}
          skip-dirs: |
            .git
            backend/node_modules
            backend/dist
            backend/coverage
            frontend/web/node_modules
            frontend/web/.next
            frontend/web/coverage
            coverage
            playwright-report
            test-results
          skip-files: |
            frontend/web/tsconfig.tsbuildinfo
            frontend/web/coverage-summary.txt

      - name: Upload filesystem SARIF
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

      - name: Explain skipped filesystem SARIF upload
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: |
          echo "Skipping SARIF upload for forked pull request because GitHub restricts security-events: write in this context."

  trivy-image:
    name: "Trivy Image Scan (${{ matrix.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: edutrack-auth
          - name: frontend
            context: ./frontend/web
            dockerfile: ./frontend/web/Dockerfile
            image: edutrack-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image locally for scanning
        if: matrix.name == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image locally for scanning
        if: matrix.name == 'frontend'
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          scanners: vuln,secret
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: 1
          timeout: ${{ env.TRIVY_TIMEOUT }}

      - name: Upload image SARIF
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

      - name: Explain skipped image SARIF upload
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: |
          echo "Skipping SARIF upload for forked pull request because GitHub restricts security-events: write in this context."
