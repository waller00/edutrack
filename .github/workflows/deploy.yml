name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Entramos a la raíz
            cd /root

            # 2. Si la carpeta no existe, clonamos. Si existe, entramos y actualizamos.
            if [ ! -d "edutrack" ]; then
              echo "Clonando por primera vez..."
              git clone https://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@github.com/joaquinwaller/edutrack.git
              cd edutrack
            else
              echo "Actualizando repositorio existente..."
              cd edutrack
              # Forzamos el pull para traer lo nuevo sin borrar el .env
              git pull origin main
            fi

            # 3. Bajamos los contenedores actuales (opcional, pero asegura limpieza)
            docker-compose -f docker-compose.cloud.yml down

            # 4. Build y Up (Docker usará el .env que ya vive en la carpeta del servidor)
            docker-compose -f docker-compose.cloud.yml up -d --build

            echo "EduTrack actualizado con éxito. ¡El .env sigue ahí!"
            docker ps