name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [ "main" ] # Se activa cada vez que hacés push a la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /root/edutrack
            cd /root/edutrack

            # 1. Traemos el código
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # 2. Levantamos con el mismo nombre que en el repo
            docker compose -f docker-compose.cloud.yml up -d --build

            echo "EduTrack desplegado con docker-compose.cloud.yml"
            docker ps