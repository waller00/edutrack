name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Entorno a desplegar manualmente"
        type: choice
        options:
          - testing
          - production
        required: true
      git_ref:
        description: "Branch, tag o commit SHA a desplegar (ej: main, develop, e5519db)"
        required: true
        default: main

permissions:
  contents: read

jobs:
  # --- NUEVO: EL CANDADO DE CALIDAD ---
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web # <--- LE DECIMOS DÓNDE ESTÁ EL CÓDIGO
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Check for errors (TypeScript & Conflicts)
        run: npm run typecheck

  deploy-testing:
    needs: validate # <--- ESTO ES LO QUE TE SALVA: Solo corre si validate dio OK
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Testing
        uses: appleboy/ssh-action@v0.1.10
        env:
          # Repo privado: PAT fine-grained o classic con scope contents:read (sin comillas en el valor del secret).
          GH_DEPLOY_TOKEN: ${{ secrets.DEPLOY_GITHUB_READ_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST_TESTING }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 40m
          envs: GH_DEPLOY_TOKEN
          script: |
            set -e
            compose() {
              if docker compose version >/dev/null 2>&1; then docker compose "$@"; elif command -v docker-compose >/dev/null 2>&1; then docker-compose "$@"; else echo "Falta docker compose (plugin) o docker-compose" >&2; exit 1; fi
            }
            REPO_HTTPS="https://github.com/joaquinwaller/edutrack.git"
            if [ -n "$GH_DEPLOY_TOKEN" ]; then
              REPO_HTTPS="https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/joaquinwaller/edutrack.git"
            fi
            cd /root
            if [ ! -d "edutrack" ]; then
              git clone "$REPO_HTTPS" edutrack
              cd edutrack
            else
              cd edutrack
              git remote set-url origin "$REPO_HTTPS"
              git fetch --all
              git reset --hard origin/develop
            fi
            CF="-f docker-compose.cloud.yml -f docker-compose.override.yml"
            compose $CF down
            docker rmi edutrack-web edutrack-auth 2>/dev/null || true
            # NEXT_PUBLIC_* va en el build de Next: sin --no-cache web puede quedar imagen vieja sin Turnstile
            compose $CF build --no-cache web
            compose $CF build auth
            compose $CF up -d --no-build
            echo "EduTrack actualizado en TESTING"

  deploy-production:
    needs: validate # <--- TAMBIÉN PROTEGEMOS PRODUCCIÓN
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Production
        uses: appleboy/ssh-action@v0.1.10
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.DEPLOY_GITHUB_READ_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          envs: GH_DEPLOY_TOKEN
          script: |
            set -e
            compose() {
              if docker compose version >/dev/null 2>&1; then docker compose "$@"; elif command -v docker-compose >/dev/null 2>&1; then docker-compose "$@"; else echo "Falta docker compose (plugin) o docker-compose" >&2; exit 1; fi
            }
            REPO_HTTPS="https://github.com/joaquinwaller/edutrack.git"
            if [ -n "$GH_DEPLOY_TOKEN" ]; then
              REPO_HTTPS="https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/joaquinwaller/edutrack.git"
            fi
            cd /root
            if [ ! -d "edutrack" ]; then
              git clone "$REPO_HTTPS" edutrack
              cd edutrack
            else
              cd edutrack
              git remote set-url origin "$REPO_HTTPS"
              git fetch --all
              git reset --hard origin/main
            fi
            CF="-f docker-compose.cloud.yml"
            compose $CF down
            docker rmi edutrack-web edutrack-auth 2>/dev/null || true
            compose $CF build --no-cache web
            compose $CF build auth
            compose $CF up -d --no-build
            echo "EduTrack actualizado en PRODUCCION"

  deploy-testing-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'testing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Manual deploy to Testing (rollback/forward)
        uses: appleboy/ssh-action@v0.1.10
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.DEPLOY_GITHUB_READ_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST_TESTING }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 40m
          envs: GH_DEPLOY_TOKEN
          script: |
            set -e
            compose() {
              if docker compose version >/dev/null 2>&1; then docker compose "$@"; elif command -v docker-compose >/dev/null 2>&1; then docker-compose "$@"; else echo "Falta docker compose (plugin) o docker-compose" >&2; exit 1; fi
            }
            REPO_HTTPS="https://github.com/joaquinwaller/edutrack.git"
            if [ -n "$GH_DEPLOY_TOKEN" ]; then
              REPO_HTTPS="https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/joaquinwaller/edutrack.git"
            fi
            cd /root
            if [ ! -d "edutrack" ]; then
              git clone "$REPO_HTTPS" edutrack
            fi
            cd edutrack
            git remote set-url origin "$REPO_HTTPS"
            git fetch --all --tags
            TARGET_REF="${{ github.event.inputs.git_ref }}"
            git reset --hard "$TARGET_REF"
            CF="-f docker-compose.cloud.yml -f docker-compose.override.yml"
            compose $CF down
            docker rmi edutrack-web edutrack-auth 2>/dev/null || true
            compose $CF build --no-cache web
            compose $CF build auth
            compose $CF up -d --no-build
            echo "EduTrack testing actualizado manualmente a $TARGET_REF"

  deploy-production-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Manual deploy to Production (rollback/forward)
        uses: appleboy/ssh-action@v0.1.10
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.DEPLOY_GITHUB_READ_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          envs: GH_DEPLOY_TOKEN
          script: |
            set -e
            compose() {
              if docker compose version >/dev/null 2>&1; then docker compose "$@"; elif command -v docker-compose >/dev/null 2>&1; then docker-compose "$@"; else echo "Falta docker compose (plugin) o docker-compose" >&2; exit 1; fi
            }
            REPO_HTTPS="https://github.com/joaquinwaller/edutrack.git"
            if [ -n "$GH_DEPLOY_TOKEN" ]; then
              REPO_HTTPS="https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/joaquinwaller/edutrack.git"
            fi
            cd /root
            if [ ! -d "edutrack" ]; then
              git clone "$REPO_HTTPS" edutrack
            fi
            cd edutrack
            git remote set-url origin "$REPO_HTTPS"
            git fetch --all --tags
            TARGET_REF="${{ github.event.inputs.git_ref }}"
            git reset --hard "$TARGET_REF"
            CF="-f docker-compose.cloud.yml"
            compose $CF down
            docker rmi edutrack-web edutrack-auth 2>/dev/null || true
            compose $CF build --no-cache web
            compose $CF build auth
            compose $CF up -d --no-build
            echo "EduTrack producción actualizado manualmente a $TARGET_REF"
