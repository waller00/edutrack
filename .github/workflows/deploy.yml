            compose $CF up -d --no-build
            bash scripts/keycloak-apply-realm-settings.sh || echo "WARN: no se pudieron aplicar los settings del realm de Keycloak"
            echo "EduTrack testing actualizado manualmente a $TARGET_REF"

  deploy-production-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production'
    concurrency:
      group: deploy-production-server
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Manual deploy to Production (rollback/forward)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 40m
          script: |
            set -e
            compose() {
              if docker compose version >/dev/null 2>&1; then docker compose "$@"; elif command -v docker-compose >/dev/null 2>&1; then docker-compose "$@"; else echo "Falta docker compose (plugin) o docker-compose" >&2; exit 1; fi
            }
            REPO_HTTPS="https://x-access-token:${{ github.token }}@github.com/joaquinwaller/edutrack.git"
            REPO_DIR="/root/edutrack"
            TARGET_REF="${{ github.event.inputs.git_ref }}"
            git_sync_from_url() {
