name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Limpieza total de la zona
            cd /root
            rm -rf edutrack
            
            # 2. Clonamos con el token directo (el que sabemos que anda)
            git clone https://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@github.com/joaquinwaller/edutrack.git
            
            # 3. Entramos y levantamos
            cd edutrack
            
            # 4. Bajamos lo que haya quedado colgado por las dudas
            docker-compose -f docker-compose.cloud.yml down
            
            # 5. Build y Up
            docker-compose -f docker-compose.cloud.yml up -d --build

            echo "EduTrack desplegado"
            docker ps