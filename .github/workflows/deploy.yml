name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Deployment Environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "host=${{ secrets.SSH_HOST }}" >> $GITHUB_OUTPUT
            echo "key=${{ secrets.SSH_PRIVATE_KEY }}" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.SSH_HOST_TESTING }}" >> $GITHUB_OUTPUT
            echo "key=${{ secrets.SSH_PRIVATE_KEY_TESTING }}" >> $GITHUB_OUTPUT
            echo "branch=develop" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ steps.set-env.outputs.host }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ steps.set-env.outputs.key }}
          script: |
            cd /root/edutrack
            git fetch --all
            git reset --hard origin/${{ steps.set-env.outputs.branch }}
            
            # Limpieza para asegurar que tome cambios de IP/Env
            docker compose -f docker-compose.cloud.yml down
            docker rmi edutrack-web edutrack-auth || true
            docker compose -f docker-compose.cloud.yml up -d --build
            
            echo "EduTrack actualizado en rama ${{ steps.set-env.outputs.branch }}"
            docker ps