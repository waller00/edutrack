name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Entorno a desplegar manualmente"
        type: choice
        options:
          - testing
          - production
        required: true
      git_ref:
        description: "Branch, tag o commit SHA a desplegar (ej: main, develop, e5519db)"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- NUEVO: EL CANDADO DE CALIDAD ---
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web # <--- LE DECIMOS DÓNDE ESTÁ EL CÓDIGO
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Check for errors (TypeScript & Conflicts)
        run: npm run typecheck

  deploy-testing:
    needs: validate # <--- ESTO ES LO QUE TE SALVA: Solo corre si validate dio OK
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Testing
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_TESTING }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          port: 22
          timeout: 120s
          command_timeout: 40m
          script: |
            set -e
            compose() {
              if docker compose version >/dev/null 2>&1; then docker compose "$@"; elif command -v docker-compose >/dev/null 2>&1; then docker-compose "$@"; else echo "Falta docker compose (plugin) o docker-compose" >&2; exit 1; fi
            }
            REPO_HTTPS="https://x-access-token:${{ github.token }}@github.com/joaquinwaller/edutrack.git"
            REPO_DIR="/root/edutrack"
            git_sync_from_url() {
              local repo_url="$1" target_ref="$2"
              git config --global --add safe.directory "$(pwd)" 2>/dev/null || true
              rm -f .git/config.lock .git/index.lock
              find .git -name '*.lock' -type f -delete 2>/dev/null || true
              if [[ "$target_ref" == origin/* ]]; then
                local branch="${target_ref#origin/}"
                git fetch "$repo_url" "+refs/heads/${branch}:refs/remotes/origin/${branch}" --tags --prune
                git reset --hard "$target_ref"
              elif git fetch "$repo_url" "$target_ref" --tags 2>/dev/null; then
                git reset --hard FETCH_HEAD
              else
                git fetch "$repo_url" "+refs/heads/${target_ref}:refs/remotes/origin/${target_ref}" --tags --prune
                git reset --hard "origin/${target_ref}"
              fi
              git clean -fd
            }
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone "$REPO_HTTPS" "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            LOCK_FILE="/tmp/edutrack-deploy.lock"
            exec 200>"$LOCK_FILE"
            flock -w 900 200 || { echo "Timeout esperando lock de deploy"; exit 1; }
            git_sync_from_url "$REPO_HTTPS" origin/develop
            CF="-f docker-compose.cloud.yml -f docker-compose.override.yml"
            # Red compartida con auth (MOODLE) y docker-compose.moodle.yml; debe existir antes de up
            docker network inspect edutrack_moodle-net >/dev/null 2>&1 || docker network create edutrack_moodle-net
            compose $CF build auth
            compose $CF build web
            compose $CF up -d --no-build
            bash scripts/keycloak-apply-realm-settings.sh || echo "WARN: no se pudieron aplicar los settings del realm de Keycloak"
            echo "EduTrack actualizado en TESTING"

  deploy-production:
    needs: validate # <--- TAMBIÉN PROTEGEMOS PRODUCCIÓN
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production-server
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 40m
          script: |
            set -e
            compose() {
              if docker compose version >/dev/null 2>&1; then docker compose "$@"; elif command -v docker-compose >/dev/null 2>&1; then docker-compose "$@"; else echo "Falta docker compose (plugin) o docker-compose" >&2; exit 1; fi
            }
            REPO_HTTPS="https://x-access-token:${{ github.token }}@github.com/joaquinwaller/edutrack.git"
            REPO_DIR="/root/edutrack"
            git_sync_from_url() {
              local repo_url="$1" target_ref="$2"
              git config --global --add safe.directory "$(pwd)" 2>/dev/null || true
              rm -f .git/config.lock .git/index.lock
              find .git -name '*.lock' -type f -delete 2>/dev/null || true
              if [[ "$target_ref" == origin/* ]]; then
                local branch="${target_ref#origin/}"
                git fetch "$repo_url" "+refs/heads/${branch}:refs/remotes/origin/${branch}" --tags --prune
                git reset --hard "$target_ref"
              elif git fetch "$repo_url" "$target_ref" --tags 2>/dev/null; then
                git reset --hard FETCH_HEAD
              else
                git fetch "$repo_url" "+refs/heads/${target_ref}:refs/remotes/origin/${target_ref}" --tags --prune
                git reset --hard "origin/${target_ref}"
              fi
              git clean -fd
            }
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone "$REPO_HTTPS" "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            LOCK_FILE="/tmp/edutrack-deploy.lock"
            exec 200>"$LOCK_FILE"
            flock -w 900 200 || { echo "Timeout esperando lock de deploy"; exit 1; }
            git_sync_from_url "$REPO_HTTPS" origin/main
            CF="-f docker-compose.cloud.yml"
            docker network inspect edutrack_moodle-net >/dev/null 2>&1 || docker network create edutrack_moodle-net
            bash scripts/validate-production-routes.sh --env .env --production
            # Build con la app aún arriba; no hacer `compose down` (deja el sitio en 521 si falla el build).
            compose $CF build web auth
            compose $CF up -d --no-build --force-recreate web auth
            bash scripts/deploy-wait-healthy.sh
            bash scripts/keycloak-apply-realm-settings.sh || echo "WARN: no se pudieron aplicar los settings del realm de Keycloak"
            echo "EduTrack actualizado en PRODUCCION"

  deploy-testing-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'testing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Manual deploy to Testing (rollback/forward)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_TESTING }}
