name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # --- NUEVO: EL CANDADO DE CALIDAD ---
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web # <--- LE DECIMOS DÓNDE ESTÁ EL CÓDIGO
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Check for errors (TypeScript & Conflicts)
        run: npm run typecheck

  deploy-testing:
    needs: validate # <--- ESTO ES LO QUE TE SALVA: Solo corre si validate dio OK
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Testing
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST_TESTING }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          script: |
            cd /root
            if [ ! -d "edutrack" ]; then
              git clone https://github.com/joaquinwaller/edutrack.git
              cd edutrack
            else
              cd edutrack
              git fetch --all
              git reset --hard origin/develop
            fi
            docker compose -f docker-compose.cloud.yml -f docker-compose.override.yml down
            docker rmi edutrack-web edutrack-auth || true
            docker compose -f docker-compose.cloud.yml -f docker-compose.override.yml up -d --build
            echo "EduTrack actualizado en TESTING"

  deploy-production:
    needs: validate # <--- TAMBIÉN PROTEGEMOS PRODUCCIÓN
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Production
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root
            if [ ! -d "edutrack" ]; then
              git clone https://github.com/joaquinwaller/edutrack.git
              cd edutrack
            else
              cd edutrack
              git fetch --all
              git reset --hard origin/main
            fi
            docker compose -f docker-compose.cloud.yml down
            docker rmi edutrack-web edutrack-auth || true
            docker compose -f docker-compose.cloud.yml up -d --build
            echo "EduTrack actualizado en PRODUCCION"
