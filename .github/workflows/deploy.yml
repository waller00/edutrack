name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root
            
            # 1. Si la carpeta no existe, la clonamos. Si existe, solo actualizamos el código.
            if [ ! -d "edutrack" ]; then
              git clone https://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@github.com/joaquinwaller/edutrack.git
              cd edutrack
            else
              cd edutrack
              git fetch --all
              git reset --hard origin/main
            fi
            
            # 2. Levantamos los contenedores (Docker va a usar el .env que ya esté en la carpeta)
            docker-compose -f docker-compose.cloud.yml down
            docker-compose -f docker-compose.cloud.yml up -d --build

            echo "EduTrack actualizado sin borrar el .env"
            docker ps
