name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [ "main" ] # Se activa cada vez que hacés push a la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
         script: |
            mkdir -p /root/edutrack
            cd /root/edutrack

            # 1. Traemos el código usando el token que nos funcionó hoy
            if [ -d ".git" ]; then
              # Esto actualiza la URL por si cambió el token y hace el pull
              git remote set-url origin https://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@github.com/joaquinwaller/edutrack.git
              git pull origin main
            else
              git clone https://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@github.com/joaquinwaller/edutrack.git .
            fi

            # 2. Levantamos con el archivo correcto (el que tiene el punto)
            docker-compose -f docker-compose.cloud.yml up -d --build

            echo "EduTrack desplegado con éxito"
            docker ps