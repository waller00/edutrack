# Deploy por SSH al droplet. El git pull usa git@github.com en el SERVIDOR:
# hace falta una Deploy key (solo lectura) en el repo y la clave privada en ~/.ssh del servidor.
# No se usa GH_PAT ni secrets extra en GitHub Actions.

name: Deploy EduTrack to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            ORIGIN_SSH="git@github.com:joaquinwaller/edutrack.git"

            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            cd /root

            if [ ! -d "edutrack" ]; then
              echo "Clonando por primera vez (SSH)..."
              git clone "$ORIGIN_SSH" edutrack
              cd edutrack
            else
              echo "Actualizando repositorio (SSH)..."
              cd edutrack
              git remote set-url origin "$ORIGIN_SSH"
              git fetch origin main
              git reset --hard origin/main
            fi

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            $DC -f docker-compose.cloud.yml down || true

            $DC -f docker-compose.cloud.yml build --no-cache auth
            $DC -f docker-compose.cloud.yml build web
            $DC -f docker-compose.cloud.yml up -d

            echo "Deploy listo."
            docker ps
