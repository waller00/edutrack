groups:
  - name: edutrack-availability
    rules:
      - alert: EduTrackEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "EduTrack endpoint unavailable"
          description: "{{ $labels.instance }} is not responding with an HTTP 2xx status."

      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter unavailable"
          description: "Prometheus cannot scrape postgres-exporter."

      - alert: EduTrackBackendMetricsDown
        expr: up{job="edutrack-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "EduTrack backend metrics unavailable"
          description: "Prometheus cannot scrape the backend metrics endpoint."

  - name: edutrack-backend
    rules:
      - alert: EduTrackBackendHighErrorRate
        expr: |
          sum(rate(edutrack_backend_http_errors_total{route!~"/health|/ready|/metrics"}[5m]))
          /
          clamp_min(sum(rate(edutrack_backend_http_requests_total{route!~"/health|/ready|/metrics"}[5m])), 0.001)
          > 0.05
          and on() sum(increase(edutrack_backend_http_requests_total{route!~"/health|/ready|/metrics"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EduTrack backend HTTP 5xx rate above 5%"
          description: "The backend has sustained a high HTTP 5xx error rate."

      - alert: EduTrackBackendHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(edutrack_backend_http_request_duration_seconds_bucket{route!~"/health|/ready|/metrics"}[5m]))
          ) > 1
          and on() sum(increase(edutrack_backend_http_requests_total{route!~"/health|/ready|/metrics"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "EduTrack backend p95 latency above one second"
          description: "The backend has sustained high application latency."

  - name: edutrack-infrastructure
    rules:
      - alert: HostDiskSpaceLow
        expr: |
          min(
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space below 15%"
          description: "The Docker host is running low on disk space."

      - alert: HostMemoryHigh
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90%"
          description: "The Docker host memory usage is high."

      - alert: ContainerCpuHigh
        expr: |
          sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container CPU usage high"
          description: "Container {{ $labels.name }} has sustained high CPU usage."

  # Este stack no incluye Alertmanager: las reglas se evalúan en Prometheus
  # (visibles en /alerts) pero no generan avisos. Las reglas operativas, las que
  # se ven en Grafana, están en monitoring/grafana/provisioning/alerting/.
  - name: edutrack-observability
    rules:
      - alert: CrowdSecMetricsUnavailable
        expr: up{job="crowdsec"} == 0 or absent(up{job="crowdsec"})
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec: no se puede verificar la detección"
          description: "Revisar salud de CrowdSec y conectividad interna de métricas. Esto no demuestra caída de la aplicación."
          runbook_url: "/d/crowdsec-observation"

      - alert: CrowdSecParsingFailures
        expr: |
          (sum(increase(cs_parser_hits_ko_total{job="crowdsec"}[10m])) > 10)
          and
          (sum(increase(cs_parser_hits_ko_total{job="crowdsec"}[10m]))
           / clamp_min(sum(increase(cs_lokisource_hits_total{job="crowdsec"}[10m])), 1) > 0.05)
          and on() (up{job="crowdsec"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CrowdSec: líneas adquiridas que no se interpretan"
          description: "Más de 10 fallos y 5% en 10 minutos. Revisar formato Nginx, filtro Loki y parsers; no reintroducir tokens en logs."
          runbook_url: "/d/crowdsec-observation"

      - alert: CadvisorContainerNamesMissing
        expr: up{job="cadvisor"} == 1 unless on() count(container_memory_working_set_bytes{job="cadvisor",name!=""})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "cAdvisor responde, pero faltan nombres de contenedores"
          description: "La atribución de recursos está incompleta. Revisar compatibilidad de cAdvisor con Docker y cgroups; no confundir cgroups con contenedores identificados."
          runbook_url: "/d/edutrack-docker-containers"
