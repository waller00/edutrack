  - orgId: 1
    name: edutrack-container-watchdog
    folder: EduTrack Alerts
    interval: 1m
    rules:
      - uid: edutrack-container-restarts-repeated
        title: "EduTrack container restarted repeatedly"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "sum by (service) (increase(edutrack_container_restarts_total[1h]))"
              instant: true
              intervalMs: 1000
              legendFormat: "reinicios en 1h"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "EduTrack - Reinicios repetidos del watchdog"
          description: "El watchdog reinicio el mismo servicio mas de 3 veces en una hora: es un crash loop, no un incidente aislado."
          impact: "El auto-reinicio esta enmascarando una causa que no se resuelve reiniciando."
          action: "Cortar el auto-reinicio para ese servicio (WATCHDOG_DRY_RUN=1 o quitar el servicio de WATCHDOG_SERVICES) y revisar logs y causa raiz."
          runbook: "journalctl -u edutrack-container-watchdog -n 100 --no-pager && cd /root/edutrack && docker compose -f docker-compose.cloud.yml logs --tail=200 web auth reverse-proxy"
        labels:
          service: edutrack
          severity: critical
        isPaused: false

      - uid: edutrack-container-watchdog-cap-reached
        title: "EduTrack watchdog gave up"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "max by (service) (edutrack_container_watchdog_cap_reached)"
              instant: true
              intervalMs: 1000
              legendFormat: "tope alcanzado"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "EduTrack - El watchdog dejo de reiniciar"
          description: "Se alcanzo el tope de reinicios por ventana y el servicio sigue unhealthy. El sistema ya no intenta recuperarlo."
          impact: "El servicio permanece caido hasta que intervenga una persona."
          action: "Revisar la causa raiz antes de reiniciar a mano. Confirmar el estado con docker ps y los logs del servicio."
          runbook: "journalctl -u edutrack-container-watchdog -n 100 --no-pager && cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps"
        labels:
          service: edutrack
          severity: critical
        isPaused: false
      - uid: edutrack-container-watchdog-stale
