apiVersion: 1

groups:
  - orgId: 1
    name: edutrack-critical-availability
    folder: EduTrack Alerts
    interval: 1m
    rules:
      - uid: edutrack-backend-health-down
        title: EduTrack backend health down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(probe_success{job="blackbox-http", instance="http://auth:4000/health"})
              instant: true
              intervalMs: 1000
              legendFormat: backend health
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack backend health is down
          description: The backend /health endpoint is not returning a successful response.
        labels:
          service: backend
          severity: critical
        isPaused: false

      - uid: edutrack-backend-ready-down
        title: EduTrack backend readiness down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(probe_success{job="blackbox-http", instance="http://auth:4000/ready"})
              instant: true
              intervalMs: 1000
              legendFormat: backend ready
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack backend readiness is down
          description: The backend /ready endpoint is failing, which can indicate database or dependency issues.
        labels:
          service: backend
          severity: critical
        isPaused: false

      - uid: edutrack-frontend-down
        title: EduTrack frontend down
        condition: C
