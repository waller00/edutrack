        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "time() - max(edutrack_container_watchdog_last_run_timestamp_seconds{job=\"node\"})"
              instant: true
              intervalMs: 1000
              legendFormat: "segundos desde la ultima corrida"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "EduTrack - El watchdog no reporta"
          description: "El timer del watchdog no corre o no puede escribir metricas: la auto-remediacion esta apagada sin que se note."
          impact: "Si un servicio se cuelga, nadie lo reinicia y solo queda la notificacion."
          action: "Revisar el timer y el servicio; confirmar que node-exporter lee el textfile."
          runbook: "systemctl status edutrack-container-watchdog.timer --no-pager && journalctl -u edutrack-container-watchdog -n 100 --no-pager"
        labels:
          service: edutrack
          severity: critical
        isPaused: false
