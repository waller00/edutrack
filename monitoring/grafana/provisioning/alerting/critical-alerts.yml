apiVersion: 1

groups:
  - orgId: 1
    name: edutrack-critical-availability
    folder: EduTrack Alerts
    interval: 1m
    rules:
      - uid: edutrack-backend-health-down
        title: EduTrack backend health down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(probe_success{job="blackbox-http", instance="http://auth:4000/health"})
              instant: true
              intervalMs: 1000
              legendFormat: backend health
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - Backend /health no disponible
          description: El endpoint interno del backend /health no responde correctamente.
          impact: La API puede estar caida o inaccesible para el frontend.
          action: Revisar el contenedor auth, sus logs recientes y el estado HTTP del backend.
          runbook: cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps auth && docker compose -f docker-compose.cloud.yml logs --tail=100 auth
        labels:
          service: backend
          severity: critical
        isPaused: false

      - uid: edutrack-backend-ready-down
        title: EduTrack backend readiness down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(probe_success{job="blackbox-http", instance="http://auth:4000/ready"})
              instant: true
              intervalMs: 1000
              legendFormat: backend ready
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - Backend /ready no disponible
          description: El backend esta vivo, pero no puede confirmar que sus dependencias esten listas.
          impact: La aplicacion puede fallar por problemas con PostgreSQL, Redis u otra dependencia interna.
          action: Revisar /ready, logs del backend y estado de PostgreSQL/Redis.
          runbook: cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps auth pg redis && docker compose -f docker-compose.cloud.yml logs --tail=100 auth
        labels:
          service: backend
          severity: critical
        isPaused: false

      - uid: edutrack-frontend-down
        title: EduTrack frontend down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(probe_success{job="blackbox-http", instance="http://web:3000/"})
              instant: true
              intervalMs: 1000
              legendFormat: frontend
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - Frontend no disponible
          description: El endpoint interno del frontend no responde correctamente.
          impact: Los usuarios pueden no poder acceder a la interfaz web de EduTrack.
          action: Revisar el contenedor web, el reverse proxy y los logs recientes del frontend.
          runbook: cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps web reverse-proxy && docker compose -f docker-compose.cloud.yml logs --tail=100 web
        labels:
          service: frontend
          severity: critical
        isPaused: false

      - uid: edutrack-postgres-exporter-down
        title: EduTrack Postgres exporter down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(up{job="postgres"})
              instant: true
              intervalMs: 1000
              legendFormat: postgres exporter
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - PostgreSQL exporter no disponible
          description: Grafana no puede confirmar el monitoreo de PostgreSQL porque postgres-exporter no esta disponible.
          impact: La base de datos puede seguir funcionando, pero se pierde visibilidad sobre sus metricas.
          action: Revisar el contenedor postgres-exporter y la conexion configurada hacia PostgreSQL.
          runbook: cd /root/edutrack && docker compose --env-file .env.monitoring -f docker-compose.monitoring.yml ps postgres-exporter && docker compose --env-file .env.monitoring -f docker-compose.monitoring.yml logs --tail=100 postgres-exporter
        labels:
          service: postgres
          severity: critical
        isPaused: false

      - uid: edutrack-backend-metrics-down
        title: EduTrack backend metrics down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(up{job="edutrack-backend"})
              instant: true
              intervalMs: 1000
              legendFormat: backend metrics
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - Metricas del backend no disponibles
          description: Prometheus no puede recolectar las metricas internas del backend.
          impact: Se pierde visibilidad sobre tasa de requests, errores 5xx, latencia y metricas del proceso Node.js.
          action: Revisar que el backend este levantado y que el puerto interno de metricas responda.
          runbook: cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps auth && docker compose -f docker-compose.cloud.yml logs --tail=100 auth
        labels:
          service: backend
          severity: critical
        isPaused: false

      - uid: edutrack-host-disk-space-critical
        title: EduTrack host disk space critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs"})
              instant: true
              intervalMs: 1000
              legendFormat: disk available ratio
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.08
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: EduTrack - Espacio en disco critico
          description: El host Docker tiene menos de 8% de espacio disponible.
          impact: PostgreSQL, Loki, Docker o el despliegue pueden fallar si el disco se llena.
          action: Revisar uso de disco, logs, imagenes Docker y volumenes antes de continuar operando.
          runbook: df -h && docker system df
        labels:
          service: host
          severity: critical
        isPaused: false

  - orgId: 1
    name: edutrack-crowdsec-sensor
    folder: EduTrack Alerts
    interval: 1m
    rules:
      - uid: edutrack-crowdsec-metrics-down
        title: "EduTrack CrowdSec metrics down"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "min(up{job=\"crowdsec\"})"
              instant: true
              intervalMs: 1000
              legendFormat: "crowdsec up"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "EduTrack - CrowdSec no expone metricas"
          description: "Prometheus no puede leer el endpoint de metricas de CrowdSec. La deteccion conductual puede estar caida sin que se note en el dashboard."
          impact: "Se pierde visibilidad de detecciones y el sensor puede estar sin procesar logs."
          action: "Revisar el contenedor crowdsec, su healthcheck y que Prometheus alcance crowdsec:6060."
          runbook: "cd /root/edutrack && docker compose -f docker-compose.crowdsec.yml ps crowdsec && docker compose -f docker-compose.crowdsec.yml logs --tail=100 crowdsec"
        labels:
          service: crowdsec
          severity: critical
        isPaused: false

      - uid: edutrack-crowdsec-heartbeat-stale
        title: "EduTrack CrowdSec heartbeat stale"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "time() - max(cs_machines_last_heartbeat_timestamp{job=\"crowdsec\"})"
              instant: true
              intervalMs: 1000
              legendFormat: "segundos desde ultimo heartbeat"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "EduTrack - Agente CrowdSec sin heartbeat"
          description: "El agente no reporta heartbeat a la LAPI hace mas de 5 minutos, aunque el endpoint de metricas responda."
          impact: "El motor puede no estar leyendo la adquisicion de Loki: las detecciones quedan ciegas."
          action: "Revisar logs de CrowdSec y la conectividad con la LAPI local."
          runbook: "cd /root/edutrack && docker compose -f docker-compose.crowdsec.yml exec -T crowdsec cscli lapi status && docker compose -f docker-compose.crowdsec.yml logs --tail=100 crowdsec"
        labels:
          service: crowdsec
          severity: warning
        isPaused: false

      - uid: edutrack-crowdsec-parse-ratio-low
        title: "EduTrack CrowdSec parse ratio low"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "sum(increase(cs_parser_hits_ok_total{job=\"crowdsec\"}[5m])) / sum(increase(cs_parser_hits_total{job=\"crowdsec\"}[5m]))"
              instant: true
              intervalMs: 1000
              legendFormat: "ratio de parseo"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.9
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 30m
        annotations:
          summary: "EduTrack - CrowdSec parsea menos del 90%"
          description: "Menos del 90% de las lineas que llegan a los parsers se interpretan correctamente en el periodo."
          impact: "Las lineas no interpretadas no pueden disparar escenarios: la cobertura real baja sin que se vea en el conteo de alertas."
          action: "Mirar el panel Parsers con mas errores y revisar el formato de la fuente en Loki."
          runbook: "cd /root/edutrack && docker compose -f docker-compose.crowdsec.yml exec -T crowdsec cscli metrics"
        labels:
          service: crowdsec
          severity: warning
        isPaused: false

      - uid: edutrack-crowdsec-detections-spike
        title: "EduTrack CrowdSec detections spike"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "sum(increase(cs_bucket_overflowed_total{job=\"crowdsec\"}[1h]))"
              instant: true
              intervalMs: 1000
              legendFormat: "disparos en 1h"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "EduTrack - Pico de detecciones CrowdSec"
          description: "Mas de 10 disparos de escenario en una hora. Con un solo escenario y trafico bajo, es anormal en este despliegue."
          impact: "Puede ser un ataque real o un falso positivo masivo por un cambio de trafico o de parsers."
          action: "Triar con scripts/crowdsec-triage.sh antes de concluir nada. No activar bloqueo durante el pico."
          runbook: "cd /root/edutrack && ./scripts/crowdsec-triage.sh --limit 100"
        labels:
          service: crowdsec
          severity: warning
        isPaused: false

      - uid: edutrack-crowdsec-decisions-active
        title: "EduTrack CrowdSec active decisions while observing"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "sum(cs_active_decisions{job=\"crowdsec\"})"
              instant: true
              intervalMs: 1000
              legendFormat: "decisiones activas"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "EduTrack - Decisiones activas en modo observacion"
          description: "La LAPI tiene decisiones activas. Con simulacion global y sin bouncer, no deberia haber ninguna."
          impact: "O la simulacion se desactivo sin revision, o hay decisiones residuales que podrian aplicarse al instalar un bouncer."
          action: "Confirmar el modo con cscli simulation status y listar decisiones antes de continuar."
          runbook: "cd /root/edutrack && docker compose -f docker-compose.crowdsec.yml exec -T crowdsec cscli simulation status && docker compose -f docker-compose.crowdsec.yml exec -T crowdsec cscli decisions list"
        labels:
          service: crowdsec
          severity: warning
        isPaused: false

  - orgId: 1
    name: edutrack-data-and-auth
    folder: EduTrack Alerts
    interval: 1m
    rules:
      - uid: edutrack-postgres-down
        title: "EduTrack PostgreSQL down"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "min(pg_up{job=\"postgres\"})"
              instant: true
              intervalMs: 1000
              legendFormat: "pg_up"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "EduTrack - PostgreSQL no responde"
          description: "El exporter conecta pero pg_up vale 0, o no hay datos: PostgreSQL no acepta conexiones."
          impact: "La aplicación pierde lectura y escritura; los inicios de sesión y el pase de lista fallan."
          action: "NO reiniciar automaticamente. Revisar disco, WAL, locks y logs de pg antes de decidir."
          runbook: "cd /root/edutrack && docker compose -f docker-compose.cloud.yml exec -T pg pg_isready -U postgres -d asistencias && docker compose -f docker-compose.cloud.yml logs --tail=100 pg && df -h"
        labels:
          service: edutrack
          severity: critical
        isPaused: false

      - uid: edutrack-keycloak-ready-down
        title: "EduTrack Keycloak not ready"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: "min(probe_success{job=\"blackbox-http\", instance=\"http://keycloak:9000/health/ready\"})"
              instant: true
              intervalMs: 1000
              legendFormat: "keycloak readiness"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
