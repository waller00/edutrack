apiVersion: 1

groups:
  - orgId: 1
    name: edutrack-critical-availability
    folder: EduTrack Alerts
    interval: 1m
    rules:
      - uid: edutrack-backend-health-down
        title: EduTrack backend health down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(probe_success{job="blackbox-http", instance="http://auth:4000/health"})
              instant: true
              intervalMs: 1000
              legendFormat: backend health
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - Backend /health no disponible
          description: El endpoint interno del backend /health no responde correctamente.
          impact: La API puede estar caida o inaccesible para el frontend.
          action: Revisar el contenedor auth, sus logs recientes y el estado HTTP del backend.
          runbook: cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps auth && docker compose -f docker-compose.cloud.yml logs --tail=100 auth
        labels:
          service: backend
          severity: critical
        isPaused: false

      - uid: edutrack-backend-ready-down
        title: EduTrack backend readiness down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(probe_success{job="blackbox-http", instance="http://auth:4000/ready"})
              instant: true
              intervalMs: 1000
              legendFormat: backend ready
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - Backend /ready no disponible
          description: El backend esta vivo, pero no puede confirmar que sus dependencias esten listas.
          impact: La aplicacion puede fallar por problemas con PostgreSQL, Redis u otra dependencia interna.
          action: Revisar /ready, logs del backend y estado de PostgreSQL/Redis.
          runbook: cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps auth pg redis && docker compose -f docker-compose.cloud.yml logs --tail=100 auth
        labels:
          service: backend
          severity: critical
        isPaused: false

      - uid: edutrack-frontend-down
        title: EduTrack frontend down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(probe_success{job="blackbox-http", instance="http://web:3000/"})
              instant: true
              intervalMs: 1000
              legendFormat: frontend
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - Frontend no disponible
          description: El endpoint interno del frontend no responde correctamente.
          impact: Los usuarios pueden no poder acceder a la interfaz web de EduTrack.
          action: Revisar el contenedor web, el reverse proxy y los logs recientes del frontend.
          runbook: cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps web reverse-proxy && docker compose -f docker-compose.cloud.yml logs --tail=100 web
        labels:
          service: frontend
          severity: critical
        isPaused: false

      - uid: edutrack-postgres-exporter-down
        title: EduTrack Postgres exporter down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(up{job="postgres"})
              instant: true
              intervalMs: 1000
              legendFormat: postgres exporter
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - PostgreSQL exporter no disponible
          description: Grafana no puede confirmar el monitoreo de PostgreSQL porque postgres-exporter no esta disponible.
          impact: La base de datos puede seguir funcionando, pero se pierde visibilidad sobre sus metricas.
          action: Revisar el contenedor postgres-exporter y la conexion configurada hacia PostgreSQL.
          runbook: cd /root/edutrack && docker compose --env-file .env.monitoring -f docker-compose.monitoring.yml ps postgres-exporter && docker compose --env-file .env.monitoring -f docker-compose.monitoring.yml logs --tail=100 postgres-exporter
        labels:
          service: postgres
          severity: critical
        isPaused: false

      - uid: edutrack-backend-metrics-down
        title: EduTrack backend metrics down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(up{job="edutrack-backend"})
              instant: true
              intervalMs: 1000
              legendFormat: backend metrics
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: EduTrack - Metricas del backend no disponibles
          description: Prometheus no puede recolectar las metricas internas del backend.
          impact: Se pierde visibilidad sobre tasa de requests, errores 5xx, latencia y metricas del proceso Node.js.
          action: Revisar que el backend este levantado y que el puerto interno de metricas responda.
          runbook: cd /root/edutrack && docker compose -f docker-compose.cloud.yml ps auth && docker compose -f docker-compose.cloud.yml logs --tail=100 auth
        labels:
          service: backend
          severity: critical
        isPaused: false

      - uid: edutrack-host-disk-space-critical
        title: EduTrack host disk space critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs"})
              instant: true
              intervalMs: 1000
              legendFormat: disk available ratio
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.08
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: EduTrack - Espacio en disco critico
          description: El host Docker tiene menos de 8% de espacio disponible.
          impact: PostgreSQL, Loki, Docker o el despliegue pueden fallar si el disco se llena.
          action: Revisar uso de disco, logs, imagenes Docker y volumenes antes de continuar operando.
          runbook: df -h && docker system df
        labels:
          service: host
          severity: critical
        isPaused: false
