; PHP de Moodle con la imagen moodlehq/moodle-php-apache (ver docker-compose.moodle.yml).
; Mismos límites que tenía la imagen Bitnami; la de Moodle HQ viene con valores de desarrollo.
memory_limit = 256M
post_max_size = 40M
upload_max_filesize = 40M
max_input_vars = 5000

display_errors = Off
log_errors = On
expose_php = Off
error_reporting = E_ALL & ~E_DEPRECATED

; Moodle no usa el progreso de subida por sesión. Apagado cierra uno de los caminos de PHP2Shell
; (CVE-2026-109619) si alguna vez la imagen queda atrás de un parche.
session.upload_progress.enabled = 0

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
