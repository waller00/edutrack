# Apache de Moodle con la imagen moodlehq/moodle-php-apache (ver docker-compose.moodle.yml).
# Escucha en 8080 como la imagen Bitnami que reemplaza: el reverse-proxy y el backend usan moodle:8080.
# Los bloqueos son los del vhost de Bitnami; esta imagen no trae mod_rewrite, así que van con LocationMatch.
Listen 8080

<VirtualHost *:8080>
  DocumentRoot ${APACHE_DOCUMENT_ROOT}
  <Directory ${APACHE_DOCUMENT_ROOT}>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride None
    Require all granted
  </Directory>

  <LocationMatch "(/vendor/|/node_modules/|(^|/)\.(?!well-known/)|composer\.json|\.lock|/environment\.xml|/install\.xml|/README|/readme|/moodle_readme|/upgrade\.txt|phpunit\.xml\.dist|/tests/behat/|/fixtures/|/package\.json|/Gruntfile\.js)">
    Require all denied
  </LocationMatch>

  # La plantilla de configuración y los scripts de consola no se abren desde el navegador:
  # `config-dist.php` respondía un error de PHP que contaba cómo está armado el servidor.
  <LocationMatch "(/config-dist\.php|/admin/cli/)">
    Require all denied
  </LocationMatch>

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
