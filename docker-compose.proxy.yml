# Reverse proxy publico para el despliegue cloud.


x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  reverse-proxy:
    logging: *default-logging
    # 1.30 estable, fijada por digest (la 1.27 no recibía parches desde abril de 2025). La config
    # se valida con esta misma imagen en CI y antes del deploy (scripts/check-nginx-config.sh).
    image: nginx:1.30-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    # El master necesita root para el 80/443 y bajar a `nginx`; nada más gana privilegios.
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CLOUDFLARE_ORIGIN_CERT_DIR:-/etc/ssl/cloudflare}:/etc/ssl/cloudflare:ro
    depends_on:
      web:
        condition: service_started
      auth:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      # stub_status (8081) prueba que el worker sirve, no solo que el config parsea.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/nginx_status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - appnet
      - moodle-net

networks:
  appnet:
    name: edutrack_net
    external: true
  moodle-net:
    name: edutrack_moodle-net
    external: true
