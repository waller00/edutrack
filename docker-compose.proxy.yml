# Reverse proxy publico para el despliegue cloud.
# Uso esperado:
#   docker compose -f docker-compose.cloud.yml -f docker-compose.proxy.yml up -d reverse-proxy
#
# Primera etapa: este archivo agrega el proxy sin cerrar aun los puertos directos
# publicados por web/auth/keycloak/moodle. El cierre se hace despues de validar.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  reverse-proxy:
    logging: *default-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CLOUDFLARE_ORIGIN_CERT_DIR:-/etc/ssl/cloudflare}:/etc/ssl/cloudflare:ro
    depends_on:
      web:
        condition: service_started
      auth:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - net
      - moodle-net

networks:
  net:
    name: edutrack_net
  moodle-net:
    name: edutrack_moodle-net
    external: true
