parent=keycloak.v2
import=common/keycloak

# Carga los estilos del tema base + los nuestros (los nuestros pisan al final).
# `?v=` en los nuestros: la URL de los recursos de Keycloak es la misma entre versiones y se cachea
# 30 días (Cloudflare y navegadores). Es el hash del contenido de edutrack.css + edutrack-login.js:
# si cambian, `src/lib/auth/keycloak-theme.test.ts` (frontend) falla y dice el valor nuevo.
# No pedir la URL nueva antes de que termine el deploy: Cloudflare guardaría el archivo viejo con ella.
# Keycloak además guarda su copia comprimida (data/tmp/kc-gzip-cache) aunque se reinicie: el deploy
# la vacía al cambiar el tema y `scripts/keycloak-verify-theme.sh` comprueba lo que sirve.
styles=css/styles.css css/edutrack.css?v=4cb53757cf
scripts=js/edutrack-login.js?v=4cb53757cf
locales=es

# Mostrar el selector de "intentar otra forma" y enlaces estándar.
kcLogoIdP-google=fa fa-google
