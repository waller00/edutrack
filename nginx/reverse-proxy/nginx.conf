worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # ===================== WAF EduTrack (nginx a medida) =====================
  # Objetivo: defensa en profundidad delante de la app (Cloudflare -> este WAF -> Express).
  # Reversible: backup en nginx.conf.bak.<ts>. Firmas SQLi/XSS en modo DETECCION (log, no bloquean).

  # -- Restauracion de IP real de Cloudflare (sin esto, todo filtrado por IP apunta a CF) --
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # -- Allowlist de red: solo Cloudflare puede llegar al origen (evalua el PEER real, no la IP restaurada) --
  # Se aplica dentro de cada "location /" de los vhosts HTTPS (healthz e iclock quedan exentos).
  geo $realip_remote_addr $cf_ok {
    default 0;
    127.0.0.0/8 1;          # loopback interno (healthchecks)
    10.0.0.0/8 1;           # redes docker internas
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
  }

  # -- Rutas de escaneo tipicas de otros stacks (ningun servicio de EduTrack las usa) --
  map $request_uri $bad_path {
    default 0;
    "~*(^|/)\.(git|env|aws|svn|htaccess|htpasswd)" 1;
    "~*/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|adminer)" 1;
    "~*/\.(vscode|idea)/" 1;
    "~*/(\.well-known/.*\.\./)" 1;
  }

  # -- User-agents de herramientas de ataque/escaneo --
  map $http_user_agent $bad_ua {
    default 0;
    "~*(sqlmap|nikto|nmap|masscan|acunetix|nessus|zgrab|dirbuster|wpscan|nuclei)" 1;
  }

  # -- BLOQUEO: firmas muy evidentes en query string, con bajo riesgo de falso positivo --
  map $args $block_injection {
    default 0;

    # SQLi evidente
    "~*(union[\s+]+select|union%20select|union/\*.*\*/select)" 1;
    "~*(information_schema|pg_catalog)" 1;
    "~*(pg_sleep\s*\(|sleep\s*\(|benchmark\s*\()" 1;

    # Path traversal / LFI / RFI evidente
    "~*(\.\./|\.\.\\|%2e%2e%2f|%252e%252e%252f)" 1;
    "~*(/etc/passwd|/etc/shadow|/proc/self/environ)" 1;
    "~*(php://|file://|expect://|zip://)" 1;

    # RCE / webshell evidente
    "~*(/bin/(ba)?sh|cmd\.exe|powershell)" 1;
    "~*(base64_decode|shell_exec|passthru|proc_open)" 1;
  }

  # -- DETECCION (no bloquea): firmas mas amplias en la query string, solo para observar --
  map $args $susp_injection {
    default 0;

    # SQLi
    "~*(insert.+into|update.+set|delete.+from|drop[\s+]+table)" 1;
    "~*(or[\s+]+1=1|and[\s+]+1=1|or[\s+]+true|and[\s+]+true)" 1;
    "~*(%27|')\s*(or|and)\s*(%27|')?[^&=]*=" 1;
    "~*(--|%2d%2d|#|%23|/\*|%2f%2a)" 1;

    # XSS
    "~*(%3Cscript|<script|</script|%3C/script)" 1;
    "~*(onerror\s*=|onload\s*=|onclick\s*=|onmouseover\s*=)" 1;
    "~*(javascript:|data:text/html|vbscript:)" 1;
    "~*(<iframe|%3Ciframe|<svg|%3Csvg)" 1;

    # PHP/webshell comunes que pueden requerir revision antes de bloquear
    "~*(eval\s*\(|assert\s*\(|system\s*\()" 1;
  }

  access_log /dev/stdout;
  log_format waf 'WAF_SUSPICIOUS $time_iso8601 ip=$remote_addr peer=$realip_remote_addr host=$host method=$request_method uri="$request_uri" ua="$http_user_agent"';
  access_log /dev/stdout waf if=$susp_injection;
  log_format waf_block 'WAF_BLOCKED $time_iso8601 ip=$remote_addr peer=$realip_remote_addr host=$host method=$request_method uri="$request_uri" status=$status ua="$http_user_agent"';
  access_log /dev/stdout waf_block if=$block_injection;
  error_log /dev/stderr warn;

  server_tokens off;

  # -- Cabeceras de seguridad: NO globales. Se aplican solo en el vhost del frontend (Next.js
  #    no las emite). Keycloak y Moodle ya mandan las suyas (mas fuertes); no las pisamos para
  #    evitar cabeceras duplicadas/conflictivas. La API usa Helmet. --

  # -- Zonas de rate limiting / conexiones (limites generosos: solo cortan floods) --
  limit_req_zone $binary_remote_addr zone=perip:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=authz:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=costoso:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=connperip:10m;
  limit_req_status 429;
  limit_conn_status 429;
  # =========================================================================

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  proxy_http_version 1.1;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_buffering on;

  # -- Anti-slowloris --
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;
  large_client_header_buffers 4 16k;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Certificado de origen emitido por Cloudflare
  # El directorio se monta desde CLOUDFLARE_ORIGIN_CERT_DIR en docker-compose.proxy.yml.
  ssl_certificate /etc/ssl/cloudflare/cert.pem;
  ssl_certificate_key /etc/ssl/cloudflare/key.pem;

  server {
    listen 80;
    server_name edutrack-uy.com www.edutrack-uy.com api.edutrack-uy.com auth.edutrack-uy.com moodle.edutrack-uy.com;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # ZKTeco iClock ADMS: algunos lectores solo hablan HTTP/80 y no siguen
    # redirects a HTTPS. Estas rutas van directo al backend principal, que
    # tambien monta /iclock y los aliases /cdata /getrequest /registry /devicecmd.
    # NO se aplica WAF aqui (los lectores no pasan por Cloudflare).
    location /iclock/ {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 80;
      proxy_buffering off;
    }

    location = /cdata {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 80;
      proxy_buffering off;
    }

    location = /getrequest {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 80;
      proxy_buffering off;
    }

    location = /registry {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 80;
      proxy_buffering off;
    }

    location = /devicecmd {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 80;
      proxy_buffering off;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 8081;
    server_name _;

    access_log off;

    location = /nginx_status {
      stub_status;
    }

    location / {
      return 404;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name edutrack-uy.com www.edutrack-uy.com;

    client_max_body_size 20m;

    # --- WAF: higiene de protocolo + firmas (healthz/iclock exentos de CF-only) ---
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
    if ($bad_path) { return 444; }
    if ($bad_ua)   { return 444; }
    limit_conn connperip 100;

    # Cabeceras de seguridad SOLO en el frontend (Next.js no las emite; no duplican con Keycloak/Moodle).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location /iclock/ {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_buffering off;
    }

    location = /cdata {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_buffering off;
    }

    location = /getrequest {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_buffering off;
    }

    location = /registry {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_buffering off;
    }

    location = /devicecmd {
      proxy_pass http://auth:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_buffering off;
    }

    location / {
      if ($cf_ok = 0) { return 444; }
      if ($block_injection) { return 403; }
      limit_req zone=perip burst=200 nodelay;
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.edutrack-uy.com;

    client_max_body_size 20m;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
    if ($bad_path) { return 444; }
    if ($bad_ua)   { return 444; }
    limit_conn connperip 100;

    # Cabeceras comunes a nivel de servidor (heredadas por las locations sin proxy_set_header propio).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Endpoints de autenticacion: limite estricto (backstop anti fuerza bruta; la app ya limita login).
    location ~ ^/auth/(login|register|verify|forgot-password|check-username) {
      if ($cf_ok = 0) { return 444; }
      if ($block_injection) { return 403; }
      limit_req zone=authz burst=20 nodelay;
      proxy_pass http://auth:4000;
    }

    # Endpoints pesados por: (reportes/exportaciones/analitica/asistente SQL-LLM/planilla de notas).
    location ~ ^/(exports|reports|analytics|admin/query-assistant|grades/sheet) {
      if ($cf_ok = 0) { return 444; }
      if ($block_injection) { return 403; }
      limit_req zone=costoso burst=10 nodelay;
      proxy_pass http://auth:4000;
    }

    location / {
      if ($cf_ok = 0) { return 444; }
      if ($block_injection) { return 403; }
      limit_req zone=perip burst=200 nodelay;
      proxy_pass http://auth:4000;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name auth.edutrack-uy.com;

    client_max_body_size 20m;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
    if ($bad_path) { return 444; }
    if ($bad_ua)   { return 444; }
    limit_conn connperip 100;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location / {
      if ($cf_ok = 0) { return 444; }
      if ($block_injection) { return 403; }
      limit_req zone=perip burst=200 nodelay;
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name moodle.edutrack-uy.com;

    client_max_body_size 100m;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
    if ($bad_path) { return 444; }
    if ($bad_ua)   { return 444; }
    limit_conn connperip 100;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Moodle es pesado en assets: NO se aplica limit_req de requests (solo limit_conn) para no romper paginas.
    location / {
      if ($cf_ok = 0) { return 444; }
      if ($block_injection) { return 403; }
      proxy_pass http://moodle:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
